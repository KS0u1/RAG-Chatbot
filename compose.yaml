# Stack: Chat-Oberfläche (app), Vektordatenbank (chroma), Paperless-Abgleich (sync) und Ollama.
# Beim ersten Start lädt ollama-init die drei Modelle einmalig herunter (einige GB, dauert).
#
# Starten:  cp .env.example .env  (Werte eintragen)  &&  docker compose up -d --build
# Portainer: Stack aus dem Git-Repository anlegen und die Variablen aus .env.example
#            unter "Environment variables" eintragen.
#
# Ollama liegt schon woanders? Dann OLLAMA_BASE_URL setzen und die Dienste ollama und
# ollama-init entfernen (oder mit `docker compose up -d --scale ollama=0 --scale ollama-init=0` starten).

name: paperless-chat

x-app-env: &app-env
  TZ: ${TZ:-Europe/Berlin}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text-v2-moe}
  OLLAMA_RERANK_MODEL: ${OLLAMA_RERANK_MODEL:-dengcao/Qwen3-Reranker-0.6B:Q8_0}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-6144}
  OLLAMA_REASONING: ${OLLAMA_REASONING:-}
  HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-6}
  RERANK_ENABLED: ${RERANK_ENABLED:-false}
  RERANK_TOP_N: ${RERANK_TOP_N:-5}
  RETRIEVER_K: ${RETRIEVER_K:-8}
  RETRIEVER_FETCH_K: ${RETRIEVER_FETCH_K:-20}
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: ${CHROMA_COLLECTION:-paperless}
  PAPERLESS_URL: ${PAPERLESS_URL:?PAPERLESS_URL setzen, z. B. http://192.168.178.64:8010}
  PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:?PAPERLESS_TOKEN setzen (Paperless > Mein Profil > API-Token)}
  PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-}
  SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-30}

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Modelle im Speicher halten. Standard sind 5 Minuten, danach lädt Ollama das Sprachmodell
      # (mehrere GB) bei der nächsten Frage neu, das dauert auf der CPU lange.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # Eine Anfrage gleichzeitig. Jede weitere parallele Anfrage braucht ein eigenes Kontextfenster im RAM.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_models:/root/.ollama
    # Kein Port nach außen: Nur app und sync sprechen mit Ollama.

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text-v2-moe}
      OLLAMA_RERANK_MODEL: ${OLLAMA_RERANK_MODEL:-dengcao/Qwen3-Reranker-0.6B:Q8_0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        for m in "$$OLLAMA_MODEL" "$$OLLAMA_EMBED_MODEL" "$$OLLAMA_RERANK_MODEL"; do
          echo "Lade Modell $$m"
          ollama pull "$$m" || exit 1
        done
        echo "Alle Modelle geladen."

  chroma:
    # Version passend zum Python-Paket chromadb in requirements.txt halten
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - chroma_data:/data
    # Kein Port nach außen: Chroma hat hier keine Anmeldung und ist nur für app und sync gedacht.

  app:
    build: .
    image: paperless-chat:local
    restart: unless-stopped
    environment:
      <<: *app-env
      SQLITE_URL: sqlite:////data/chat_history.db
    volumes:
      - app_data:/data
    ports:
      - "8501:8501"
    depends_on:
      - chroma
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sync:
    build: .
    image: paperless-chat:local
    restart: unless-stopped
    command: ["python", "-m", "infra.paperless_sync", "--loop"]
    environment:
      <<: *app-env
    depends_on:
      - chroma
      - ollama

volumes:
  chroma_data:
  app_data:
  ollama_models:
