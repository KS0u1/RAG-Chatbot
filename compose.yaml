# Stack: Chat-Oberfläche (app), Vektordatenbank (chroma) und regelmäßiger Paperless-Abgleich (sync).
# Ollama läuft separat (bestehender Container oder eigener Host), siehe OLLAMA_BASE_URL in .env.example.
#
# Starten:  cp .env.example .env  (Werte eintragen)  &&  docker compose up -d --build
# Portainer: Stack aus dem Git-Repository oder per Web-Editor anlegen und die Variablen aus
#            .env.example unter "Environment variables" eintragen.

name: paperless-chat

x-app-env: &app-env
  TZ: ${TZ:-Europe/Berlin}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL setzen, z. B. http://192.168.178.64:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text-v2-moe}
  OLLAMA_RERANK_MODEL: ${OLLAMA_RERANK_MODEL:-dengcao/Qwen3-Reranker-0.6B:Q8_0}
  RERANK_ENABLED: ${RERANK_ENABLED:-true}
  RERANK_TOP_N: ${RERANK_TOP_N:-4}
  RETRIEVER_K: ${RETRIEVER_K:-8}
  RETRIEVER_FETCH_K: ${RETRIEVER_FETCH_K:-20}
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: ${CHROMA_COLLECTION:-paperless}
  PAPERLESS_URL: ${PAPERLESS_URL:?PAPERLESS_URL setzen, z. B. http://192.168.178.64:8010}
  PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:?PAPERLESS_TOKEN setzen (Paperless > Mein Profil > API-Token)}
  PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-}
  SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-30}

services:
  chroma:
    # Version passend zum Python-Paket chromadb in requirements.txt halten
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - chroma_data:/data
    # Kein Port nach außen: Chroma hat hier keine Anmeldung und ist nur für app und sync gedacht.

  app:
    build: .
    image: paperless-chat:local
    restart: unless-stopped
    environment:
      <<: *app-env
      SQLITE_URL: sqlite:////data/chat_history.db
    volumes:
      - app_data:/data
    ports:
      - "8501:8501"
    depends_on:
      - chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sync:
    build: .
    image: paperless-chat:local
    restart: unless-stopped
    command: ["python", "-m", "infra.paperless_sync", "--loop"]
    environment:
      <<: *app-env
    depends_on:
      - chroma

volumes:
  chroma_data:
  app_data:
